name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  # Builds with no way to mint an OIDC token: the build runs project code (the container build and
  # the dependency install), so it never holds `id-token: write`.
  build:
    name: build the distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Check the tag against the release manifest and main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match the manifest version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit tagged $TAG is not on main" >&2
            exit 1
          fi
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Build the sdist and wheel and write the SBOM
        # Runs in the pinned Python container: twine check, then a CycloneDX SBOM of the locked runtime set.
        run: just dist "$RUNNER_TEMP/out"
      - name: Keep the distributions and the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            ${{ runner.temp }}/out/dist/*
            ${{ runner.temp }}/out/sbom.cdx.json
          retention-days: 90

  # Signs what the build job produced. It runs no project code: it downloads the artifact and calls
  # the attestation action.
  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the Sigstore certificate is bound to this job's OIDC identity
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/out
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/dist/*

  # Holds only `id-token: write`, and only to exchange it for a PyPI upload token. It checks out
  # nothing and runs nothing but the publish action.
  publish:
    name: publish to PyPI
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) and PEP 740 attestations
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            upload.pypi.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/out
      - name: Publish to PyPI
        # No registry secret: PyPI exchanges the job's OIDC token for a short-lived upload token through
        # the trusted publisher attached to the project, and the action uploads PEP 740 attestations.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/out/dist
          attestations: true
