name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  require-ci:
    name: require successful CI on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # query CI workflow runs for this release commit
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        # Main's CI concurrency can cancel this run. A cancellation fails publishing;
        # the owner must re-run CI before re-running the publish workflow.
        run: |
          deadline=$((SECONDS + 3540))
          while (( SECONDS < deadline )); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$COMMIT&per_page=100" --jq '.workflow_runs | sort_by(.id) | last | {status, conclusion}')"
            status="$(jq -r '.status // ""' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "ci on commit $COMMIT concluded $conclusion; publishing is blocked" >&2
              exit 1
            fi
            sleep 30
          done
          echo "timed out waiting for ci on commit $COMMIT" >&2
          exit 1

  # Builds with no way to mint an OIDC token: the build runs project code (the container build and
  # the dependency install), so it never holds `id-token: write`, and it runs outside the release
  # environment.
  build:
    name: build the distributions
    needs: require-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sdist: ${{ steps.digests.outputs.sdist }}
      sdist_sha256: ${{ steps.digests.outputs.sdist_sha256 }}
      wheel: ${{ steps.digests.outputs.wheel }}
      wheel_sha256: ${{ steps.digests.outputs.wheel_sha256 }}
      sbom_sha256: ${{ steps.digests.outputs.sbom_sha256 }}
      sums_sha256: ${{ steps.digests.outputs.sums_sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check the tag against the release manifest and main
        env:
          TAG: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" != "$COMMIT" ]; then
            echo "the release tag no longer points to the commit verified by CI" >&2
            exit 1
          fi
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match the manifest version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit tagged $TAG is not on main" >&2
            exit 1
          fi
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Build the sdist and wheel and write the SBOM
        # Runs in the pinned Python container: twine check, then a CycloneDX SBOM of the locked runtime set.
        run: just dist "$RUNNER_TEMP/out"
      - name: Write the digests
        id: digests
        working-directory: ${{ runner.temp }}/out
        run: |
          count="$(find dist -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "expected one sdist and one wheel in dist, found $count files" >&2
            exit 1
          fi
          sdist="$(basename "$(find dist -type f -name '*.tar.gz')")"
          wheel="$(basename "$(find dist -type f -name '*.whl')")"
          if [ -z "$sdist" ] || [ -z "$wheel" ]; then
            echo "dist must hold one .tar.gz and one .whl" >&2
            exit 1
          fi
          sha256sum "dist/$sdist" "dist/$wheel" sbom.cdx.json > SHA256SUMS
          {
            echo "sdist=$sdist"
            echo "sdist_sha256=$(sha256sum "dist/$sdist" | cut -d' ' -f1)"
            echo "wheel=$wheel"
            echo "wheel_sha256=$(sha256sum "dist/$wheel" | cut -d' ' -f1)"
            echo "sbom_sha256=$(sha256sum sbom.cdx.json | cut -d' ' -f1)"
            echo "sums_sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Keep the distributions, the SBOM and the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            ${{ runner.temp }}/out/dist/*
            ${{ runner.temp }}/out/sbom.cdx.json
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # The only job with an OIDC token, and it sits behind the release environment. It runs no project
  # code: it checks every file against the digests the build job computed, attests the distributions
  # and the SBOM, then uploads the distributions to PyPI (trusted publisher, PEP 740 attestations).
  publish:
    name: attest and publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # the Sigstore certificate and PyPI trusted publishing are bound to this job's OIDC identity
      attestations: write # stores the provenance attestation on the repository
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            upload.pypi.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Fetch the build's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/out
      - name: Verify the files against the build job's digests
        working-directory: ${{ runner.temp }}/out
        env:
          SDIST: ${{ needs.build.outputs.sdist }}
          WHEEL: ${{ needs.build.outputs.wheel }}
          EXPECTED_SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          EXPECTED_SBOM_SHA256: ${{ needs.build.outputs.sbom_sha256 }}
          EXPECTED_SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
        run: |
          verify() {
            actual="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ -z "$2" ] || [ "$actual" != "$2" ]; then
              echo "the digest of $1 is $actual, not the build job's $2" >&2
              exit 1
            fi
          }
          count="$(find dist -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "expected one sdist and one wheel in dist, found $count files" >&2
            exit 1
          fi
          verify "dist/$SDIST" "$EXPECTED_SDIST_SHA256"
          verify "dist/$WHEEL" "$EXPECTED_WHEEL_SHA256"
          verify sbom.cdx.json "$EXPECTED_SBOM_SHA256"
          verify SHA256SUMS "$EXPECTED_SUMS_SHA256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/out/dist/*
            ${{ runner.temp }}/out/sbom.cdx.json
      - name: Publish to PyPI
        # The action runs in a container pulled from ghcr.io, hence the two registry endpoints above.
        # No registry secret: PyPI exchanges the job's OIDC token for a short-lived upload token through
        # the trusted publisher attached to the project, and the action uploads PEP 740 attestations.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/out/dist
          attestations: true
